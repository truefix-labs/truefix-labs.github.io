<main class="profile" id="main"><div class="portrait"><img data-portrait="" src="../../assets/team/chen-wei.jpg" alt="Chen Wei portrait" width="900" height="1125"></div><article class="profile-copy"><p class="eyebrow" data-shell="eyebrow">产品设计视角</p><h1 data-name="">Chen Wei</h1><p class="role" data-role="">数据完整性</p><p class="eyebrow" data-shell="questionLabel">这个视角持续追问的问题</p><h2 class="question" data-question="">用户能知道这个数字来自哪里、现在是否仍有效吗？</h2><p class="explanation" data-explanation="">这个视角让行情数据保持可理解。TrueFix 不应把所有数字当成同等可靠，而应保留 Provider、时间、币种、复权方式和修订记录。</p><p class="eyebrow" data-shell="focusLabel">重点检查什么</p><div class="focus" data-focus=""><div><strong>来源</strong><span>显示数值由哪个 Provider 提供。</span></div><div><strong>时效</strong><span>明确时间戳和过期数据。</span></div><div><strong>修订</strong><span>让更正和转换过程可以解释。</span></div></div><div class="profile-links"><a href="/zh-cn/about/" data-shell="back">返回关于我们</a><a href="/zh-cn/guide/" data-shell="read">阅读使用指南</a></div></article></main><div class="locale-links"><a lang="zh-CN" hreflang="zh-CN" href="/zh-cn/about/chen-wei/">简体中文</a> · <a lang="ja" hreflang="ja" href="/ja/about/chen-wei/">日本語</a> · <a lang="ko" hreflang="ko" href="/ko/about/chen-wei/">한국어</a> · <a lang="en" hreflang="en" href="/en/about/chen-wei/">English</a></div></body></html>
